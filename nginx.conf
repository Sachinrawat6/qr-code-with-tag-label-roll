server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets — significantly smaller responses for JS/CSS/HTML/SVG.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cache hashed Vite build assets aggressively (filenames change on rebuild).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static template / favicon — short cache.
    location ~* \.(?:csv|ico|png|jpg|jpeg|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback — every unknown path returns index.html so React Router
    # can handle client-side routes (e.g. /qr) on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell — guarantees fresh asset URLs after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hide nginx version, basic security headers.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
